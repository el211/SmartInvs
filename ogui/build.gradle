sourceCompatibility = 8

dependencies {
    implementation project(':core')
plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

sourceCompatibility = 8

repositories {
    mavenCentral()
    // If SmartInvs isn't on mavenCentral for your version, keep this:
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation project(':core')

    // SmartInvs shaded inside OGUI:
    implementation 'fr.minuskube.inv:smart-invs:1.2.7'

    // Spigot provided by server:
    compileOnly 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    // Prevent duplicate files when including :core output.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = 'OGUI-' + project.version + '.jar'
    from(project(':core').sourceSets.main.output) {
        exclude 'plugin.yml'
    }
}

signing {
    required = false
}
